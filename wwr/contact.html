<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Josh Wilson">
    <title>Contact Us | Dry Oar Rafting | Josh Wilson</title>
    <meta name="description"
      content="Contact White Rafting Company with questions about reservations, trips, or general inquiries.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwrblue.jpg" alt="Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-main">

            <div class="contact-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7303.844609549175!2d-111.71562124512876!3d40.29298156090358!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874d9ad9b19eab4f%3A0xa29d0e40b061151b!2sOrem%20Community%20Park!5e1!3m2!1sen!2sus!4v1780969657421!5m2!1sen!2sus"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="contact-right">
                <div class="company-info">
                    <h1>White Water Rafting Company</h1>
                    <p>581 W 165 S St, Orem, UT 84058</p>
                    <p>Phone: <a href="tel:+11234567890">(123) 456-7890</a></p>
                    <p>Email: <a href="mailto:companyemail@email.com">companyemail@email.com</a></p>
                </div>

                <form action="#" method="get">

                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-row">
                        <span>Message Purpose</span>

                        <div class="radio-group">
                            <input type="radio" id="purpose-general" name="purpose" value="general"
                              required>
                            <label for="purpose-general">General Inquiry</label>

                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">
                            <label for="purpose-reservation">Reservation Question</label>

                            <input type="radio" id="purpose-website" name="purpose" value="website">
                            <label for="purpose-website">Website Suggestion</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"
                          placeholder="Type here"></textarea>
                    </div>

                    <div class="form-row checkbox-row">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please Subscribe me to the monthyly
                            newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>

                </form>
            </div>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employeepicture1.jpg" alt="Employee 1">
                    <figcaption>Employee One</figcaption>
                </figure>
                <figure>
                    <img src="images/employeepicture2.jpg" alt="Employee 2">
                    <figcaption>Employee Two</figcaption>
                </figure>
                <figure>
                    <img src="images/employeepicture3.jpg" alt="Employee 3">
                    <figcaption>Employee Three</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 WhiteWater | Rafting | Josh Wilson</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.png" alt="Facebook">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.png" alt="Instagram">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin.png" alt="Linkedin">
            </a>
        </nav>
    </footer>

</body>

</html>
