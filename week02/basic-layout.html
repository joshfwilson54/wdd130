<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="Description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="Author" content="Josh Wilson">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="Basic Logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li>
                <a href="https://en.wikipedia.org/wiki/Giant_panda">Giant Panda</a>
            </li>
            <li>
                <a href="https://en.wikipedia.org/wiki/Red_panda">Red Panda</a>
            </li>
        </ul>
    </nav>
    <main>
        <h1>
            This is a Title for my webpage about stuff
        </h1>
        <section>
            <h2>Heading2</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Dolorum, asperiores.</p>
        </section>
        <section>
            <h2>Another Heading2</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Perspiciatis, eligendi.</p>
        </section>
        <aside>
            <img
              src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/aba-nigeria/1200x1920/aba-nigeria-temple-lds-248706-wallpaper.jpg"
              alt="Nigeria Temple" width="200">
        </aside>
        <footer>
            <p>My name is Josh Wilson</p>
        </footer>
    </main>
</body>

</html>
